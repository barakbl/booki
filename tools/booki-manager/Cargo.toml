[package]
name = "booki-manager"
version = "0.1.0"
edition = "2021"
description = "Menubar sidecar that watches browser bookmarks and runs Booki sync + ingest on a schedule."
publish = false

[[bin]]
name = "booki-manager"
path = "src/main.rs"

[dependencies]
tray-icon = "0.19"
tao = "0.30"
notify = "7"
notify-debouncer-full = "0.4"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
auto-launch = "0.5"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
crossbeam-channel = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
jiff = "0.2"
# Native folder picker for the "Pick Booki folder…" tray item. Default
# features give NSOpenPanel on macOS, GTK3 on Linux, Win32 on Windows.
rfd = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = "0.2"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
