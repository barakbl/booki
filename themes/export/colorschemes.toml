# Named color palettes the export wizard offers as a one-click filler for
# the theme-vars step. Each scheme provides values per variable name; the
# wizard applies them to whichever color vars the active theme declares
# (vars without a matching key are left untouched).
#
# Standard role names a scheme may provide. Themes opt into whichever of
# these they actually use:
#   bg         page background
#   text       primary foreground
#   link       interactive / hyperlink color
#   accent     primary accent / brand
#   secondary  secondary accent (different hue from `accent`)
#   muted      de-emphasized text (comments, metadata, hints)
#   success    positive / OK state
#   warning    caution / partial state
#   danger     error / destructive state
#
# A scheme is offered for any theme that declares at least one matching
# color var. Picker swatches always render the full palette so the user
# can compare flavors at a glance even if their theme only consumes a
# subset.

# ─── Catppuccin (https://github.com/catppuccin/catppuccin) ──────────
# Mapping: bg=base, text=text, link=blue, accent=mauve, secondary=peach,
#          muted=overlay1, success=green, warning=yellow, danger=red.

